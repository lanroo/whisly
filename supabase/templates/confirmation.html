<!-- Template de confirmação de cadastro do Wishly.
     Aplicado via Management API (config/auth: mailer_templates_confirmation_content).
     Variáveis do Supabase: {{ .ConfirmationURL }}, {{ .Email }}, {{ .SiteURL }} -->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#fcf8fb;padding:32px 16px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="440" cellpadding="0" cellspacing="0" role="presentation" style="max-width:440px;width:100%;background-color:#ffffff;border-radius:24px;padding:40px 32px;box-shadow:0 10px 30px rgba(36,41,65,0.10);">
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <span style="display:inline-block;font-size:22px;font-weight:800;color:#242941;letter-spacing:0.02em;">Wishly</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:8px;">
            <h1 style="margin:0;font-size:22px;font-weight:700;color:#1b1b1d;">Confirme seu e-mail</h1>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <p style="margin:0;font-size:14px;line-height:1.6;color:#5d5e63;">
              Falta só um passo para começar a guardar seus desejos.<br />
              Confirme o endereço <strong style="color:#1b1b1d;">{{ .Email }}</strong> abaixo.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background-color:#242941;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:15px 44px;border-radius:999px;">
              Confirmar e-mail
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:8px;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#8a8b99;">
              Se você não criou uma conta no Wishly,<br />
              pode ignorar este e-mail.
            </p>
          </td>
        </tr>
      </table>
      <table width="440" cellpadding="0" cellspacing="0" role="presentation" style="max-width:440px;width:100%;">
        <tr>
          <td align="center" style="padding-top:20px;">
            <p style="margin:0;font-size:11px;color:#b0b0ba;">
              Wishly — seus desejos num só lugar<br />
              <a href="{{ .SiteURL }}" style="color:#8a8b99;text-decoration:underline;">{{ .SiteURL }}</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
